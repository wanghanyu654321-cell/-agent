name: Customer Support Agent Gate

on:
  pull_request:
  push:
    branches:
      - main
      - feat/v1.2-blind-eval-ci
      - feat/v2.0-knowledge-grounding
      - fix/v2.0.1-faq-admission
      - feat/v2.1-real-knowledge-retrieval
      - feature/wecom-live-wire-v1
      - fix/v2.1.1-eval-integrity
      - job-ready/integration-v1
      - job-ready/thin-digital-employee-v1

jobs:
  independent-gate:
    runs-on: ubuntu-latest
    env:
      JOB_READY_EVAL_REPORT_ROOT: /tmp/job-ready-regressions
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16-bookworm@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_DB: customer_support_agent_ci
          POSTGRES_USER: customer_support_agent_ci
          POSTGRES_PASSWORD: customer_support_agent_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U customer_support_agent_ci -d customer_support_agent_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout complete repository history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Record exact checkout provenance
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'

      - name: Verify Node version
        run: node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 19)) process.exit(1); console.log(process.versions.node)"

      - name: Install declared dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Verify immutable tags, Pi pins, and architecture boundaries
        run: node scripts/verify-integrity.mjs

      - name: Run unit and runtime tests
        run: npm test

      - name: Run mandatory PostgreSQL identity integration gate
        run: npm run test:postgres-identity
        env:
          POSTGRES_TEST_URL: postgresql://customer_support_agent_ci:customer_support_agent_ci_password@localhost:5432/customer_support_agent_ci

      - name: Run mandatory PostgreSQL business integration gate
        run: npm run test:postgres-business
        env:
          POSTGRES_TEST_URL: postgresql://customer_support_agent_ci:customer_support_agent_ci_password@localhost:5432/customer_support_agent_ci

      - name: Run mandatory Phase 2C PostgreSQL application composition gate
        run: npm run test:postgres-application
        env:
          POSTGRES_TEST_URL: postgresql://customer_support_agent_ci:customer_support_agent_ci_password@localhost:5432/customer_support_agent_ci

      - name: Run Job-Ready isolated Node and frontend contract gates
        run: npm run test:job-ready

      - name: Run Core A real PostgreSQL StoreOps and WeCom gates
        run: npm run test:postgres-core-a
        env:
          POSTGRES_TEST_URL: postgresql://customer_support_agent_ci:customer_support_agent_ci_password@localhost:5432/customer_support_agent_ci

      - name: Run Core B real PostgreSQL registry and unresolved-profile guard gate
        run: npm run test:postgres-core-b
        env:
          POSTGRES_RAG_TEST_URL: postgresql://customer_support_agent_ci:customer_support_agent_ci_password@localhost:5432/customer_support_agent_ci

      - name: Use pinned Python
        # Distinct from skipped local/general-suite database tests.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Run composed Job-Ready PostgreSQL HTTP integration gate
        run: npm run test:postgres-job-ready
        env:
          POSTGRES_TEST_URL: postgresql://customer_support_agent_ci:customer_support_agent_ci_password@localhost:5432/customer_support_agent_ci

      - name: Install pinned private service test dependencies
        run: python -m pip install -r ai-service/requirements-test.txt

      - name: Run Python deterministic contracts and real PostgreSQL driver gate
        working-directory: ai-service
        run: |
          python -c "import os; assert os.environ.get('POSTGRES_RAG_TEST_URL')"
          python -B -m unittest discover -s tests -v
          cd ..
          npx vitest --run tests/job-ready-integration/vector-postgres.integration.test.ts
        env:
          POSTGRES_RAG_TEST_URL: postgresql://customer_support_agent_ci:customer_support_agent_ci_password@localhost:5432/customer_support_agent_ci

      - name: Build package
        run: npm run build

      - name: Run format, lint, and type checks
        run: npm run check

      - name: Run V1 controlled safety evaluation
        run: npm run eval:safety

      - name: Run V1.1 robustness evaluation
        run: npm run eval:safety:robustness

      - name: Run V1.2 blind holdout evaluation
        run: npm run eval:safety:holdout

      - name: Run V2.0 governed knowledge evaluation
        run: npm run eval:knowledge

      - name: Run V2.1 public sanitized retrieval regression
        run: npm run eval:retrieval:public

      - name: Run V2.1 public real-world retrieval and V2.1.1 integrity evaluation
        run: npm run eval:retrieval:public-real

      - name: Validate public production Compose contract
        env:
          POSTGRES_DB: customer_support_agent_ci
          POSTGRES_USER: customer_support_agent_ci
          POSTGRES_PASSWORD: ci-url-safe-password
          DATABASE_URL: postgresql://customer_support_agent_ci:ci-url-safe-password@postgres:5432/customer_support_agent_ci
          STOREOPS_TIME_ZONE: Asia/Shanghai
          WECOM_CORP_ID: wwci1234567890
          WECOM_CALLBACK_TOKEN: ciCallbackToken123
          WECOM_CALLBACK_AES_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
          RAG_SERVICE_CREDENTIAL: public-compose-ci-only
          RAG_DATABASE_URL: postgresql://customer_support_agent_ci:ci-url-safe-password@postgres:5432/customer_support_agent_ci
        run: docker compose -f compose.production.yaml config >/dev/null

      - name: Run Docker delivery persistence smoke
        env:
          RAG_SERVICE_CREDENTIAL: job-ready-disposable-ci-only
        run: |
          docker compose up --build -d
          node scripts/docker-delivery-smoke.mjs write
          docker compose down
          docker compose up -d
          node scripts/docker-delivery-smoke.mjs read-after-recreate
          docker compose exec -T app node --input-type=module -e "const u='http://ai-service:8000/health';const a=await fetch(u,{signal:AbortSignal.timeout(5000)});if(a.status!==401)throw Error('private service auth gate');const b=await fetch(u,{headers:{authorization:'Bearer job-ready-disposable-ci-only'},signal:AbortSignal.timeout(5000)});const body=await b.json();if(b.status!==503||body.error!=='retrieval_unavailable')throw Error('unresolved profile must stay unavailable');console.log('PRIVATE FASTAPI AUTH=PASS; GAP-03/04 READINESS=BLOCKED');"

      - name: Diagnose Docker delivery smoke failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color app postgres ai-service

      - name: Clean up Docker delivery smoke
        if: always()
        run: docker compose down -v --remove-orphans

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-support-agent-evaluations
          if-no-files-found: error
          path: |
            /tmp/job-ready-regressions
            evals/safety/robustness/reports/latest.json
            evals/safety/holdout/reports/first-run.json
            evals/safety/holdout/reports/latest.json
            evals/knowledge/reports/latest.json
            evals/knowledge/reports/latest.md
            evals/retrieval/reports/public-latest.json
            evals/retrieval/reports/public-latest.md
            evals/retrieval/reports/first-run.json
            evals/retrieval/reports/public-real-world-final.json
            evals/retrieval/reports/public-real-world-v2.1.1-final.json
