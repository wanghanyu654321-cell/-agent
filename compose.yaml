name: customer-support-agent-demo

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16-bookworm@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
    environment:
      POSTGRES_DB: customer_support_agent_demo
      POSTGRES_USER: customer_support_agent_demo
      POSTGRES_PASSWORD: customer_support_agent_demo_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U customer_support_agent_demo -d customer_support_agent_demo
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  app:
    build:
      context: .
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://customer_support_agent_demo:customer_support_agent_demo_password@postgres:5432/customer_support_agent_demo
      ENTERPRISE_RETRIEVAL_MODE: ${ENTERPRISE_RETRIEVAL_MODE:-lexical}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-}
      RAG_SERVICE_CREDENTIAL: ${RAG_SERVICE_CREDENTIAL:-}
      RAG_EMBEDDING_PROFILE: ${RAG_EMBEDDING_PROFILE:-}
      RAG_CORPUS_CLASSIFICATION: ${RAG_CORPUS_CLASSIFICATION:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      RAG_SERVICE_CREDENTIAL: ${RAG_SERVICE_CREDENTIAL:-}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-}
      RAG_EMBEDDING_MODE: ${RAG_EMBEDDING_MODE:-}
      RAG_EMBEDDING_PROFILE: ${RAG_EMBEDDING_PROFILE:-}
      RAG_CORPUS_CLASSIFICATION: ${RAG_CORPUS_CLASSIFICATION:-}
      RAG_INGEST_TIMEOUT_SECONDS: ${RAG_INGEST_TIMEOUT_SECONDS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    # No host ports. Missing explicit S2 configuration keeps readiness 503.

volumes:
  postgres-data:
