# First-certificate bootstrap for frontagent.cn.
# Copied into /etc/nginx/sites-available; not used by Docker.
server {
    listen 80;
    listen [::]:80;
    server_name frontagent.cn www.frontagent.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 200 "frontagent.cn TLS bootstrap\n";
        add_header Content-Type text/plain;
    }
}
