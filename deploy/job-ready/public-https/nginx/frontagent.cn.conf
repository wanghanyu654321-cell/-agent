# Public HTTPS edge for frontagent.cn.
# Host Nginx is the only Internet-facing service. The Node app is bound by
# compose.production.yaml to 127.0.0.1:3000; FastAPI and PostgreSQL have no host ports.

limit_req_zone $binary_remote_addr zone=frontagent_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=frontagent_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=frontagent_conn:10m;

upstream frontagent_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name frontagent.cn www.frontagent.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://frontagent.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.frontagent.cn;

    ssl_certificate /etc/letsencrypt/live/frontagent.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frontagent.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FRONTAGENT_SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://frontagent.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name frontagent.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/frontagent.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frontagent.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FRONTAGENT_SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 64k;
    limit_conn frontagent_conn 20;

    location = /healthz {
        proxy_pass http://frontagent_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    location = /api/v1/auth/login {
        limit_req zone=frontagent_login burst=5 nodelay;
        proxy_pass http://frontagent_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /api/ {
        limit_req zone=frontagent_api burst=30 nodelay;
        proxy_pass http://frontagent_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://frontagent_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
