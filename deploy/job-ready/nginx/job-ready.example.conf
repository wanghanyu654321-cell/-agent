# Job-Ready example Nginx reverse proxy — ISOLATED Track D support file.
#
# This is an EXAMPLE only. It is not referenced by compose.yaml or any Dockerfile,
# and it does not wire the real stack; Final Integration owns production wiring.
# Replace every <PLACEHOLDER>. NEVER commit real certificates, keys or secrets.
#
# Target topology (Job-Ready Parallel Execution Directive section 10):
#   Internet -> Domain / HTTPS -> Nginx -> Linux host -> Docker Compose
#      |- Node enterprise app      (public; proxied below)
#      |- FastAPI ai-service       (internal; called by Node, NOT exposed here)
#      |- PostgreSQL + pgvector    (internal; NEVER exposed here)
#
# Only the Node enterprise app is fronted. The ai-service and database stay on
# the internal compose network and must not be published to the public edge.

# Published port of the Node enterprise app on the Linux host.
upstream job_ready_node_app {
    server 127.0.0.1:<NODE_APP_PORT>;
    keepalive 32;
}

# Redirect all plaintext HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <DOMAIN>;

    # Certificate material lives outside Git (e.g. Let's Encrypt). Placeholders only.
    ssl_certificate     <TLS_FULLCHAIN_PEM_PATH>;
    ssl_certificate_key <TLS_PRIVKEY_PEM_PATH>;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:JOB_READY_SSL:10m;
    ssl_session_timeout 1d;

    # Minimal hardening headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 1m;

    # Liveness probe passthrough used by scripts/job-ready-health-smoke.mjs.
    location = /healthz {
        proxy_pass http://job_ready_node_app;
        access_log off;
    }

    # Application traffic (HTTP API + served web console).
    location / {
        proxy_pass http://job_ready_node_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    <PROXY_READ_TIMEOUT_S>s;
    }

    # NOTE: The WeCom callback route is intentionally NOT defined here.
    # CONTRACT GAP-01 (official WeCom API family / wire callback contract) and
    # GAP-02 (employee vs external-customer mapping) are unresolved. Integration
    # owns the selected callback location, its ack/egress behavior and any
    # allow-listing, once those gaps are independently approved. Do not invent a
    # callback path in this example.
}
